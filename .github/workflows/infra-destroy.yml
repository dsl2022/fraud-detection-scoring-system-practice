# Infrastructure teardown (Terraform DESTROY) — MANUAL ONLY.
#
# Deliberately separate from infra.yml: destroy is never automatic. It runs only
# via workflow_dispatch, requires typing the exact confirmation phrase, and goes
# through the same GitHub Environment protection (manual approval for prod) and
# the SAME apply concurrency group as infra.yml/app-deploy.yml so a teardown can
# never overlap an in-flight apply on the shared state.
#
# What it tears down: the full app+infra stack for the chosen ENV (network,
# platform, app, audit_trail). What it LEAVES: the bootstrap state backend
# (separate state/dir) and the out-of-band SSM image params — so the env can be
# reapplied later via infra.yml. The audit table's prevent_destroy guard is
# handled out-of-band by the Makefile target (state rm + delete-table), keeping
# the guard intact in code for normal applies.

name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment to DESTROY"
        required: true
        default: "dev"
        type: choice
        options: [dev, stage, prod]
      confirm:
        description: "Type destroy-<env> exactly (e.g. destroy-dev) to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENV: ${{ github.event.inputs.env }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Manual approval gate (prod especially) via Environment protection rules.
    environment: ${{ github.event.inputs.env }}
    # SAME group string as the apply jobs in infra.yml / app-deploy.yml so a
    # destroy is serialized against any apply on this env's shared state.
    concurrency:
      group: terraform-apply-${{ github.event.inputs.env }}
      cancel-in-progress: false
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy-${ENV}" ]; then
            echo "::error::confirm must be exactly 'destroy-${ENV}' (got '${{ github.event.inputs.confirm }}')"
            exit 1
          fi
          echo "Confirmed teardown of ENV=${ENV}"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # init the env backend, then destroy non-interactively. The Makefile target
      # handles the audit table's prevent_destroy out of band and leaves the
      # bootstrap state backend untouched.
      - name: Terraform init
        run: make tf-init ENV=${ENV}

      - name: Terraform destroy
        run: make tf-destroy ENV=${ENV} CONFIRM=destroy-${ENV} AUTO_APPROVE=1

      - name: Verify no billable resources remain
        run: make tf-destroy-check ENV=${ENV}
